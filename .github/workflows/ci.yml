# Las regresiones que levantan el runtime real de DSH se saltan solas cuando no existe
# DSH_MODULE_ROOT, así que esta CI cubre la suite estándar del repositorio.
name: Pruebas

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

jobs:
  test:
    # ubuntu-22.04 permite user namespaces sin la restricción AppArmor de 24.04,
    # que bubblewrap necesita para las pruebas end-to-end del canal.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # El lint estático ve sin gastar corrida lo que los dos primeros
      # despachos reales enseñaron por la vía cara: el contexto `runner` no
      # está disponible en el env de un job (HTTP 422) y un desajuste de caja
      # (`run_dir`/`RUN_DIR`) solo se nota cuando el paso consume la variable.
      # actionlint ejecuta shellcheck sobre los pasos run cuando está en PATH
      # (la imagen del runner lo trae). Versión fijada, descarga sin pipes:
      # el código de salida no se deduce de un pipeline.
      - name: Lint estático de workflows (actionlint fijado)
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -no-color
      - uses: actions/setup-python@0ae58361cdfd39e2950bed97a1e26aa20c3d8955 # v5
        with:
          python-version: '3.x'
      - name: bubblewrap para las pruebas del canal de inferencia
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Identidad de git para las pruebas que crean commits
        run: |
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "CI"
      - run: python3 -B -m unittest discover -s tests
