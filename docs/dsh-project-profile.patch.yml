# Portable project-scoped DSH overlay.
# Do not apply this file to ~/.dsh or a shared profile.
# Replace SKILL_ROOT with the absolute workspace skill directory only in a
# dedicated profile copy after checking the effective preset composition.
# This file is intentionally a template: an unresolved placeholder is a
# configuration error, not a path to create.
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - SKILL_ROOT
