# Overlay de arranque DSH: carga workflow-write.mjs y doc-drift.mjs junto a
# este archivo. El runtime upstream rechaza write/bash con sandbox_permissions
# igual al modo vigente («not strictly wider», defecto M7); workflow-write
# registra workflow_write con el resolver corregido. doc-drift gobierna la
# deriva documental al cierre del turno (ADR 0002): re-ancla la línea base en
# silencio o bloquea el cierre con una directiva acotada a los documentos
# afectados. Se aplica vía `dsh web --patch <este archivo>` desde
# launch_dsh_web; no instala nada en el home DSH. Un overlay que no puede
# aplicarse falla loud en el boot.
- insert:
  - name: ./workflow-write.mjs
  - name: ./doc-drift.mjs
